name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run monthly without pushes to catch silent breakage from upstream changes
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Guard against accidental Hugging Face model downloads in CI
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0 nbformat==5.11.1

      - name: Run pytest
        run: pytest -v

      - name: Validate notebook with nbformat
        run: |
          python -c "import nbformat; nb = nbformat.read('transcribe_colab.ipynb', as_version=4); nbformat.validate(nb); print('nbformat validation passed')"
